
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOLEKSI MISZACKSON</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111a;
      color: white;
    }
    header {
      padding: 22px;
      text-align: center;
      background: #191b2a;
      border-bottom: 1px solid #303244;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .welcome, .video-box {
      background: #1b1d2b;
      border: 1px solid #303244;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
    }
    .welcome { text-align: center; }
    h2 { margin-top: 0; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: #000;
    }
    footer {
      text-align: center;
      color: #aeb4ce;
      padding: 25px;
    }
  </style>
</head>
<body>
  <header>▶ KOLEKSI MISZACKSON</header>

  <main>
    <section class="welcome">
      <h2>Selamat Datang!</h2>
      <p>Koleksi video pilihan untuk kamu.</p>
    </section>

    <section class="video-box">
      <h2>Pemutar Video</h2>
      <p>Video pilihan:</p>
      <iframe
        class="player"
        src="https://drive.google.com/file/d/1gi4SqjSr3RC_EMi_ufVV7GdMSgCwcZ3w/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <footer>© KOLEKSI MISZACKSON</footer>
</body>
</html>
