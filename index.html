
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOLEKSI MISZACKSON</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111a;
      color: white;
    }
    header {
      padding: 22px;
      text-align: center;
      background: #191b2a;
      border-bottom: 1px solid #303244;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .welcome, .video-box {
      background: #1b1d2b;
      border: 1px solid #303244;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
    }
    .welcome { text-align: center; }
    h2 { margin-top: 0; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: #000;
    }
    footer {
      text-align: center;
      color: #aeb4ce;
      padding: 25px;
    }
/* Desain modern KOLEKSI MISZACKSON */
body {
  background: linear-gradient(135deg, #10111a, #21152c, #10111a);
  color: #ffffff;
  line-height: 1.6;
}

header {
  background: rgba(20, 18, 32, 0.96);
  color: #ff4fa3;
  font-size: 26px;
  letter-spacing: 1px;
  border-bottom: 2px solid #ff4fa3;
  box-shadow: 0 4px 20px rgba(255, 79, 163, 0.12);
}

main {
  max-width: 1000px;
  margin: 35px auto;
}

.welcome,
.video-box {
  background: rgba(31, 29, 48, 0.95);
  border: 1px solid #49304f;
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
}

h2 {
  color: #ff75b7;
}

.player {
  display: block;
  width: 100%;
  min-height: 220px;
  box-shadow: 0 0 22px rgba(255, 79, 163, 0.12);
}

footer {
  border-top: 1px solid #393044;
  margin-top: 40px;
}

@media (max-width: 600px) {
  header {
    font-size: 21px;
    padding: 18px 10px;
  }

  main {
    margin: 20px auto;
  }

  .welcome,
  .video-box {
    padding: 17px;
  }

  .player {
    min-height: 200px;
  }
}


    
/* Galeri kartu video modern */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.video-card {
  background: #201b30;
  border: 1px solid #49304f;
  border-radius: 16px;
  padding: 14px;
  overflow: hidden;
  transition: transform 0.2s ease;
}

.video-card:hover {
  transform: translateY(-4px);
}

.video-card h3 {
  color: #ff75b7;
  margin: 0 0 12px;
}

.video-card iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 10px;
  background: #000;
}
.video-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.video-modal[hidden] {
  display: none;
}

.video-modal-content {
  position: relative;
  width: min(100%, 1100px);
  aspect-ratio: 16 / 9;
  background: #000;
  border: 1px solid #00d9ff;
  border-radius: 12px;
  overflow: hidden;
}

.video-modal-content iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.close-video {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #ff3b81;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .video-modal {
    padding: 8px;
  }
}
  </style>
</head>
<body>
  <header>▶ KOLEKSI MISZACKSON</header>

  <main>
    <section class="welcome">
      <h2>Selamat Datang!</h2>
      <p>Koleksi video pilihan untuk kamu.</p>
    </section>

    <section class="video-box">
  <h2>Galeri Video</h2>
  <p>Pilih video yang ingin kamu tonton.</p>

  <div class="video-grid">
<div class="video-card">
  <div class="video-thumbnail" onclick="openVideo()">
    <img
      src="https://drive.google.com/thumbnail?id=1gi4SqjSr3RC_EMi_ufVV7GdMSgCwcZ3w&sz=w800"
      alt="Video 1">
    <button class="play-button" type="button">▶</button>
  </div>
  <h3>Video 1</h3>
</div>
  </div>
</section>
  <div id="videoModal" class="video-modal" hidden>
  <div class="video-modal-content">
    <button class="close-video" onclick="closeVideo()" type="button">✕</button>
    <iframe
      id="mainVideoPlayer"
      src=""
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>
</div>
  </main>

  <footer>© KOLEKSI MISZACKSON</footer>
  
<script>
const videoModal = document.getElementById("videoModal");
const mainVideoPlayer = document.getElementById("mainVideoPlayer");

function openVideo() {
  videoModal.hidden = false;
  mainVideoPlayer.src =
    "https://drive.google.com/file/d/1gi4SqjSr3RC_EMi_ufVV7GdMSgCwcZ3w/preview";
}

function closeVideo() {
  videoModal.hidden = true;
  mainVideoPlayer.src = "";
}
</script>
</body>
</html>
