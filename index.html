
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOLEKSI MISZACKSON</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111a;
      color: white;
    }
    header {
      padding: 22px;
      text-align: center;
      background: #191b2a;
      border-bottom: 1px solid #303244;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .welcome, .video-box {
      background: #1b1d2b;
      border: 1px solid #303244;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
    }
    .welcome { text-align: center; }
    h2 { margin-top: 0; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: #000;
    }
    footer {
      text-align: center;
      color: #aeb4ce;
      padding: 25px;
    }
/* Desain modern KOLEKSI MISZACKSON */
body {
  background: linear-gradient(135deg, #10111a, #21152c, #10111a);
  color: #ffffff;
  line-height: 1.6;
}

header {
  background: rgba(20, 18, 32, 0.96);
  color: #ff4fa3;
  font-size: 26px;
  letter-spacing: 1px;
  border-bottom: 2px solid #ff4fa3;
  box-shadow: 0 4px 20px rgba(255, 79, 163, 0.12);
}

main {
  max-width: 1000px;
  margin: 35px auto;
}

.welcome,
.video-box {
  background: rgba(31, 29, 48, 0.95);
  border: 1px solid #49304f;
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
}

h2 {
  color: #ff75b7;
}

.player {
  display: block;
  width: 100%;
  min-height: 220px;
  box-shadow: 0 0 22px rgba(255, 79, 163, 0.12);
}

footer {
  border-top: 1px solid #393044;
  margin-top: 40px;
}

@media (max-width: 600px) {
  header {
    font-size: 21px;
    padding: 18px 10px;
  }

  main {
    margin: 20px auto;
  }

  .welcome,
  .video-box {
    padding: 17px;
  }

  .player {
    min-height: 200px;
  }
}

  
  </style>
</head>
<body>
  <header>▶ KOLEKSI MISZACKSON</header>

  <main>
    <section class="welcome">
      <h2>Selamat Datang!</h2>
      <p>Koleksi video pilihan untuk kamu.</p>
    </section>

    <section class="video-box">
      <h2>Pemutar Video</h2>
      <p>Video pilihan:</p>
      <iframe
        class="player"
        src="https://drive.google.com/file/d/1gi4SqjSr3RC_EMi_ufVV7GdMSgCwcZ3w/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </section>
  </main>

  <footer>© KOLEKSI MISZACKSON</footer>
</body>
</html>
