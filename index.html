
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLEKSI MISZACKSON</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101116;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      background: #191a22;
      border-bottom: 1px solid #30313b;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    main { max-width: 1000px; margin: 35px auto; padding: 0 18px; }
    .welcome {
      padding: 25px;
      background: #1b1c26;
      border-radius: 12px;
      text-align: center;
    }
    .video-box {
      margin-top: 25px;
      padding: 30px 15px;
      background: #1b1c26;
      border: 1px solid #30313b;
      border-radius: 12px;
      text-align: center;
    }
    video {
      display: block;
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 8px;
    }
    .note { color: #b8bac8; line-height: 1.6; }
    footer {
      padding: 25px;
      color: #b8bac8;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>▶ KOLEKSI MISZACKSON</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Selamat Datang!</h2>
      <p class="note">Koleksi video pilihan untuk kamu.</p>
    </section>

    <section class="video-box">
      <h2>Pemutar Video</h2>
      <p class="note">
        Video akan ditampilkan di sini setelah tautan video ditambahkan.
      </p>
      <video controls playsinline preload="metadata">
        <source src="" type="video/mp4">
        Browser kamu tidak mendukung pemutar video.
      </video>
    </section>
  </main>

  <footer>© KOLEKSI MISZACKSON</footer>
</body>
</html>
